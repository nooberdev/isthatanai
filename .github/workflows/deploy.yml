name: Deploy demo a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Compilar librería
        run: bun run build
      - name: Compilar demo (base de Pages)
        run: bun run --filter=demo build
        env:
          BASE_PATH: /is-that-an-ai
      - name: Evitar que Jekyll ignore _app
        run: touch apps/demo/build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
